services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/setgoal
      SPRING_DATASOURCE_USERNAME: setgoal
      SPRING_DATASOURCE_PASSWORD: setgoal
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: setgoal
      POSTGRES_USER: setgoal
      POSTGRES_PASSWORD: setgoal
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
